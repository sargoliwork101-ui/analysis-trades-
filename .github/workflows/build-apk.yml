name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          tail -n 60 build.log
          if [ "$code" -ne 0 ]; then
            echo "## ❌ Build failed — error lines" >> "$GITHUB_STEP_SUMMARY"
            {
              echo '```'
              grep -E "^(e: |w: .*deprecat|FAILURE:|\\* What went wrong|\\* Try:|> |Caused by)" build.log | head -n 40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "^(e: |FAILURE:|> |Caused by:)" build.log | head -n 25 | while IFS= read -r line; do
              enc="${line//'%'/'%25'}"
              enc="${enc//$'\r'/'%0D'}"
              enc="${enc//$'\n'/'%0A'}"
              echo "::error::${enc}"
            done
          fi
          exit "$code"

      - name: Rename APK for Easy Download
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/debug/app-debug.apk build-output/PulseMarket-v1.0.apk
          ls -la build-output/

      - name: Upload APK to Artifacts (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: PulseMarket-Android-APK
          path: build-output/PulseMarket-v1.0.apk
          retention-days: 90

      - name: Create GitHub Release (Optional on tag or main)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/PulseMarket-v1.0.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
